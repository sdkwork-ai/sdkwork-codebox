version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - tls: sdkwork.com
        mode: web
        web: adaptive
        domain: codebox.sdkwork.com
      - tls: birdcoder.com
        mode: web
        web: adaptive
        domain: codebox.birdcoder.com
      - tls: dtupay.com
        mode: web
        web: adaptive
        domain: codebox.dtupay.com
      - tls: noaper.com
        mode: web
        web: adaptive
        domain: codebox.noaper.com
      - tls: sdkwork.cn
        mode: web
        web: adaptive
        domain: codebox.sdkwork.cn
      - tls: birdcoder.cn
        mode: web
        web: adaptive
        domain: codebox.birdcoder.cn
      - tls: dtupay.cn
        mode: web
        web: adaptive
        domain: codebox.dtupay.cn
      - tls: noaper.cn
        mode: web
        web: adaptive
        domain: codebox.noaper.cn
      - tls: skubc.com
        mode: web
        web: adaptive
        domain: codebox.skubc.com
      - tls: skubc.cn
        mode: web
        web: adaptive
        domain: codebox.skubc.cn
      - tls: zowalk.com
        mode: web
        web: adaptive
        domain: codebox.zowalk.com
      - tls: zowalk.cn
        mode: web
        web: adaptive
        domain: codebox.zowalk.cn
      - tls: offer86.com
        mode: web
        web: adaptive
        domain: codebox.offer86.com
      - tls: offer86.cn
        mode: web
        web: adaptive
        domain: codebox.offer86.cn
      - tls: 86offer.com
        mode: web
        web: adaptive
        domain: codebox.86offer.com
      - tls: 86offer.cn
        mode: web
        web: adaptive
        domain: codebox.86offer.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: host-service
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - tls: sdkwork.com
        mode: web
        web: adaptive
        domain: codebox.sdkwork.com
      - tls: birdcoder.com
        mode: web
        web: adaptive
