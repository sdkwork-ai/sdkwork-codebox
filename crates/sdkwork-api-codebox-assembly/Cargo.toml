[package]
rust-version.workspace = true
name = "sdkwork-api-codebox-assembly"
edition = "2021"
version = "0.1.0"
description = "Generated API assembly for sdkwork-codebox application HTTP plane."


[lints]
workspace = true
[lib]
name = "sdkwork_api_codebox_assembly"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
sdkwork_web_bootstrap = { workspace = true }
sdkwork_web_core = { workspace = true }
